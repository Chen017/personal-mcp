[project]
name = "personal-mcp"
version = "0.1.0"
description = "Personal dual FastMCP servers (Etalib Web + GitHub Personal) for Gemini Custom Apps"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
