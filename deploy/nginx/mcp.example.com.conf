server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    # Server 1: Notes & Web (SiYuan Notes + Firecrawl v2)
    location = /<SECRET_PATH_NOTES>/mcp {
        access_log off;
        proxy_pass http://127.0.0.1:8101/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Server 2: GitHub Personal
    location = /<SECRET_PATH_GITHUB>/mcp {
        access_log off;
        proxy_pass http://127.0.0.1:8102/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Return 404 on all other paths to prevent probing
    location / {
        return 404;
    }
}

# IMPORTANT: In your public SiYuan Share site (e.g. notes.example.com) Nginx server block,
# reject/strip forged internal auth headers from external clients:
#
#   if ($http_x_mcp_internal_token != "") {
#       return 403;
#   }
#   proxy_set_header X-MCP-Internal-Token "";
